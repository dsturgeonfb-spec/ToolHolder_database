name: CI

# Typecheck, unit/API tests, browser tests of the real UI, and a smoke test of the Electron app
# under a virtual display. The Windows installer is built by desktop-release.yml.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit and API tests (incl. BUILD_SPEC §7 acceptance checks)
        run: node --test --test-concurrency=2 "dist/test/unit/**/*.test.js" "dist/test/api/**/*.test.js"

      - name: Install Chromium for the browser tests
        run: npx playwright-core install --with-deps chromium

      - name: Browser tests
        run: node --test --test-concurrency=1 "dist/test/e2e/**/*.test.js"

      - name: Desktop app smoke test
        run: xvfb-run -a node --test dist/test/electron/smoke.test.js

      - name: Seed rebuild still matches the committed catalogue
        # build_catalogue.py regenerates the seed from data/raw; the committed DB must agree on the
        # acceptance numbers (it is rebuilt into a temp copy, never over the committed file).
        run: |
          tmp=$(mktemp -d)
          cp -r data db scripts images "$tmp"/
          python3 "$tmp/scripts/build_catalogue.py" "$tmp" > "$tmp/build.log"
          python3 - "$tmp" <<'PY'
          import sqlite3, sys
          db = sqlite3.connect(f"{sys.argv[1]}/db/holder_catalogue.sqlite")
          assert db.execute("SELECT SUM(qty_on_site) FROM v_stock_on_hand").fetchone()[0] == 54
          assert db.execute("SELECT COUNT(*) FROM holders").fetchone()[0] == 88
          assert db.execute("SELECT COUNT(*) FROM data_flags").fetchone()[0] == 31
          assert db.execute("SELECT COUNT(*) FROM v_gl_check").fetchone()[0] == 4
          print("seed rebuild OK")
          PY
