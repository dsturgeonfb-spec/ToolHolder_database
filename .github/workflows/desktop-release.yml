name: Desktop release

# Builds the Windows installer (NSIS, per-user, no admin rights) on a real Windows machine, runs the
# unit/API tests there too (node:sqlite and Windows paths), and smoke-tests the PACKAGED app before
# anything is published.
#
# - Every push/PR that touches the app: the installer is attached to the run as an artifact (kept 14 days).
# - A desktop-v<version> tag, or "Run workflow" on the default branch with "release" ticked:
#   also published as a GitHub Release with release-notes.md.
on:
  push:
    branches: ['**']
    tags: ['desktop-v*']
    paths:
      - 'src/**'
      - 'ui/**'
      - 'db/**'
      - 'images/**'
      - 'buildResources/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - 'electron-builder.yml'
      - 'tsconfig.json'
      - 'release-notes.md'
      - '.github/workflows/desktop-release.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'ui/**'
      - 'db/**'
      - 'images/**'
      - 'buildResources/**'
      - 'package.json'
      - 'package-lock.json'
      - 'electron-builder.yml'
      - '.github/workflows/desktop-release.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Also publish the installer as GitHub Release desktop-v<version> (default branch only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write   # only used by the release step's conditions below
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit and API tests on Windows
        run: node --test --test-reporter=spec --test-concurrency=2 "dist/test/{unit,api}/**/*.test.js"

      - name: Build the installer
        run: npx electron-builder --win --config electron-builder.yml --publish never

      - name: Smoke-test the packaged app
        shell: pwsh
        run: |
          $env:HC_ELECTRON_EXECUTABLE = (Resolve-Path "release/win-unpacked/Holder Catalogue.exe").Path
          node --test --test-reporter=spec dist/test/electron/smoke.test.js

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: holder-catalogue-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Work out the release tag
        id: version
        if: ${{ startsWith(github.ref, 'refs/tags/desktop-v') || (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          tag="desktop-v${version}"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version (expected $tag)."
            exit 1
          fi
          if ! grep -q "^# Holder Catalogue ${version}\b" release-notes.md; then
            echo "::error::release-notes.md is not headed '# Holder Catalogue ${version}'. Write this version's notes first."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        if: ${{ steps.version.outcome == 'success' }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Holder Catalogue ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: release/*.exe
          fail_on_unmatched_files: true
          make_latest: true
